name: CI
on:
  pull_request:
  push:
    branches: [master]

# Every job checks out into `idura_verify` rather than the default directory named
# after the repository. Not cosmetic: `flutter build ios` in example/ cannot
# resolve packages unless the plugin root's basename is the plugin name. The
# reason is in DEVELOPING.md, "Clone into a directory named idura_verify".

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idura_verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: idura_verify
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: idura_verify/.fvmrc
          cache: true
      - run: flutter pub get
      # The example is a separate package, and `flutter analyze` at the root
      # descends into it, so without this its `package:idura_verify` import is
      # unresolved and the analyzer reports that instead of anything real.
      - run: flutter pub get
        working-directory: idura_verify/example
      - name: Format
        run: ./scripts/format.sh --check
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Bridge matches its schema
        run: ./scripts/verify-generated.sh

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idura_verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: idura_verify
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: idura_verify/.fvmrc
          cache: true
      - name: Install ktlint
        run: |
          curl -sSLo /tmp/ktlint \
            https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x /tmp/ktlint
          sudo mv /tmp/ktlint /usr/local/bin/ktlint
      - name: ktlint
        run: ktlint 'android/**/*.kt' 'example/android/**/*.kt'
      # First, because it is what writes example/android/local.properties and
      # resolves the Flutter Gradle plugin that the unit tests below need.
      - name: Build the example
        run: flutter build apk --debug
        working-directory: idura_verify/example
      - name: Unit tests
        run: ./gradlew :idura_verify:testDebugUnitTest
        working-directory: idura_verify/example/android

  ios:
    name: iOS
    # Pinned rather than macos-latest, because the Xcode and SwiftPM versions are
    # exactly what this job is testing against. A runner image rolling underneath
    # us should break on a bump we chose, not on a morning we didn't.
    runs-on: macos-26
    defaults:
      run:
        working-directory: idura_verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: idura_verify
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: idura_verify/.fvmrc
          cache: true
      - name: Install swiftlint
        run: brew install swiftlint
      - name: swiftlint
        run: swiftlint lint --strict --quiet
      # Compiles the bridge against the real SDK and resolves the whole SwiftPM
      # graph, which is where most of this plugin's packaging risk lives. It does
      # *not* cover the associated-domains entitlement: --no-codesign skips
      # ProcessProductPackaging, so the entitlement is never processed or embedded
      # and its $(IDURA_DOMAIN) substitution is proven by e2e-ios instead.
      - name: Build the example
        run: flutter build ios --no-codesign
        working-directory: idura_verify/example

  swiftpm-only:
    name: SwiftPM-only guidance
    # Its own job because it changes global `flutter config`, which would leak
    # into any other step sharing the runner.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: idura_verify
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: idura_verify/.fvmrc
          cache: true
      - name: A CocoaPods consumer is told what to do
        run: |
          set -euo pipefail

          # Shipping no podspec is load-bearing: it is what makes flutter_tools
          # name the fix instead of letting the consumer hit an unexplained link
          # error. That is a DX promise with nothing else holding it in place, so
          # it gets a test.
          #
          # A scratch app rather than example/: the example's project.pbxproj
          # permanently carries an XCLocalSwiftPackageReference, so with SPM off
          # Xcode fails to resolve that long before flutter_tools says anything.
          # A freshly created app is what a consumer actually has.
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --project-name spmcheck "$RUNNER_TEMP/spmcheck"
          cd "$RUNNER_TEMP/spmcheck"
          flutter pub add "idura_verify:{\"path\":\"$GITHUB_WORKSPACE/idura_verify\"}"

          if flutter build ios --no-codesign >build.log 2>&1; then
            echo "error: the build succeeded, so the guidance never appeared." >&2
            cat build.log >&2
            exit 1
          fi

          if ! grep -q 'only compatible with Swift Package Manager' build.log; then
            echo "error: the build failed, but not with the SwiftPM-only guidance:" >&2
            cat build.log >&2
            exit 1
          fi

          echo "OK: a CocoaPods consumer is told to enable Swift Package Manager."

  # The end-to-end mock login, on each platform. Both talk to the live samples
  # tenant, so an outage there fails these and nothing else. See DEVELOPING.md,
  # "End-to-end tests".
  e2e-android:
    name: End-to-end (Android)
    runs-on: ubuntu-latest-m
    # A login that never returns stalls the test's own deadline, because frames
    # barely pump while the browser covers the app.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: idura_verify
      # The Play Store system image, Flutter and the Gradle build together run
      # the stock runner out of disk mid-test. None of these toolchains is used.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: idura_verify/.fvmrc
          cache: true
      - name: Install the Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.9.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      # The Play Store image because it ships a current Chrome to host the login,
      # where the plain google_apis images carry an old one. The same image
      # idura-verify-android's own mock login runs on.
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google-apis-playstore-x86_64
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."
      # Until its first run is done, Chrome shows a full-screen prompt in place of
      # the login tab and the callback never comes back. --disable-fre skips it;
      # Chrome only reads /data/local/tmp/chrome-command-line while it is the debug
      # app, and drops the first token as argv[0]. idura-verify-android's
      # IduraTestRunner does the same from its instrumentation runner. Each
      # script line runs on its own, hence the one-line logcat dump on failure:
      # the emulator is gone by the time a later step could look. AppAuth logs
      # only when its tag is made loggable, and it is the one place that says
      # whether a login the app saw as cancelled was a real redirect or not.
      - name: Mock login
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: idura_verify/example
          script: |
            adb shell "echo '_ --disable-fre --no-first-run --no-default-browser-check' > /data/local/tmp/chrome-command-line && chmod 0644 /data/local/tmp/chrome-command-line"
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell am force-stop com.android.chrome
            adb shell setprop log.tag.AppAuth VERBOSE
            adb logcat -c
            adb logcat -v time > /tmp/logcat.txt 2>&1 < /dev/null &
            patrol test --target patrol_test/mock_login_test.dart --device emulator-5554 || { grep -E 'ActivityTaskManager|IntentFilterVer|AppLinks|BulkAsyncVerifier|DomainVerif|IduraVerify|AppAuth|AndroidRuntime|flutter' /tmp/logcat.txt | tail -400; exit 1; }

  e2e-ios:
    name: End-to-end (iOS)
    runs-on: macos-26
    # Non-blocking: on GitHub's macOS runners the Simulator's associated-domains
    # check (swcd) never finishes fetching the tenant's apple-app-site-association,
    # neither through Apple's CDN nor directly, so the login fails with
    # associatedDomainsNotConfigured through no fault of the code under test.
    # @criipto/verify-expo hit the same and moved its iOS e2e off these runners.
    continue-on-error: true
    defaults:
      run:
        working-directory: idura_verify/example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: idura_verify
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: idura_verify/.fvmrc
          cache: true
      - name: Install the Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.9.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      # A fresh device by UDID rather than a name: the image carries an
      # "iPhone 17 Pro" for every installed runtime, so the name is ambiguous.
      #
      # Retries only an associatedDomainsNotConfigured failure, after a pause:
      # swcd fetches the association file lazily, so a later attempt can find it
      # in place when the first could not. Any other failure fails straight away.
      - name: Mock login
        run: |
          set -euo pipefail
          xcodebuild -version
          udid=$(xcrun simctl create e2e "iPhone 17 Pro")
          echo "udid=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          for attempt in 1 2 3 4 5; do
            if patrol test --target patrol_test/mock_login_test.dart --device "$udid" 2>&1 | tee /tmp/e2e.log; then
              echo "Passed on attempt $attempt"
              exit 0
            fi
            grep -q associatedDomainsNotConfigured /tmp/e2e.log || exit 1
            echo "::warning::Attempt $attempt failed with associatedDomainsNotConfigured"
            sleep 30
          done
          exit 1
      # swcd is what decides whether the app may claim the login callback, so its
      # log is where an associated-domains failure explains itself.
      - name: Associated-domains log
        if: failure() && env.udid
        run: |
          xcrun simctl spawn "$udid" log show --last 15m --style compact \
            --predicate 'process == "swcd" OR subsystem == "com.apple.AuthenticationServices"'
